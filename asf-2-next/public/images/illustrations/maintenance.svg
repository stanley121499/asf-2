<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Background circles -->
  <circle cx="200" cy="150" r="120" fill="#F5F5F3" opacity="0.6"/>
  <circle cx="200" cy="150" r="80" fill="#F0EDE8" opacity="0.8"/>

  <!-- ASF Logo / Shopping bag icon -->
  <g transform="translate(145, 85)">
    <!-- Bag body -->
    <rect x="10" y="35" width="90" height="75" rx="8" fill="#C9A96E" opacity="0.9"/>
    <!-- Bag handle -->
    <path d="M30 35 C30 15 80 15 80 35" stroke="#C9A96E" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Bag shine -->
    <rect x="20" y="45" width="25" height="4" rx="2" fill="white" opacity="0.4"/>
    <!-- Lock icon on bag -->
    <circle cx="55" cy="72" r="8" fill="white" opacity="0.6"/>
    <rect x="51" y="68" width="8" height="10" rx="2" fill="white" opacity="0.6"/>
  </g>

  <!-- Decorative dots -->
  <circle cx="80" cy="100" r="6" fill="#C9A96E" opacity="0.3"/>
  <circle cx="320" cy="100" r="6" fill="#C9A96E" opacity="0.3"/>
  <circle cx="100" cy="200" r="4" fill="#C9A96E" opacity="0.2"/>
  <circle cx="300" cy="200" r="4" fill="#C9A96E" opacity="0.2"/>
  <circle cx="60" cy="160" r="3" fill="#C9A96E" opacity="0.15"/>
  <circle cx="340" cy="160" r="3" fill="#C9A96E" opacity="0.15"/>
</svg>
